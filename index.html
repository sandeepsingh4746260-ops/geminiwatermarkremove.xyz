  <body>
    <div id="app"></div>
    <noscript>
      <main style="max-width:760px;margin:60px auto;padding:20px;font-family:system-ui,sans-serif">
        <h1>Gemini Watermark Remover</h1>

    <!-- Permanent native file input: kept outside the app so it cannot be
         hidden/clipped/covered by app CSS. The label in the app points to it
         with the standard HTML `for` attribute. -->
    <input id="mediaFile" type="file" accept="image/png,image/jpeg,image/webp,video/mp4,video/webm,video/quicktime,.png,.jpg,.jpeg,.webp,.mp4,.webm,.mov,.m4v" aria-label="Choose image or video" style="position:fixed;left:-10000px;top:0;width:1px;height:1px;opacity:0;pointer-events:none">
    <script>
      // Capture the native selection immediately, independently of the app's
      // framework code. This makes the upload event reliable in Chromium,
      // Edge and Firefox and also handles the same file being selected again.
      (function(){
        const input=document.getElementById('mediaFile');
        if(!input) return;
        input.addEventListener('change',function(){
          window.dispatchEvent(new CustomEvent('media-file-selected'));
        },true);
      })();
    </script>
